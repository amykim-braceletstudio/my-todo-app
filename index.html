<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Portal & To-Do App</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
        .main-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); width: 340px; text-align: center; }
        .main-img { width: 100%; border-radius: 8px; margin-bottom: 20px; object-fit: cover; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { padding: 12px 16px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: block; transition: 0.2s; }
        .btn-todo { background-color: #28a745; }
        .btn-todo:hover { background-color: #218838; }
        .btn-link { background-color: #007bff; }
        .btn-link:hover { background-color: #0069d9; }
    </style>
</head>
<body>
    <div class="main-card">
        <!-- 메인 사진 (파일명에 맞춰 08.png / 08.jpg로 자동 연결) -->
        <img src="08.png" alt="메인 사진" class="main-img" onerror="this.src='08.jpg'">

        <div class="btn-group">
            <a href="todo.html" class="btn btn-todo">📝 To-Do List 이동하기</a>
            <a href="https://www.wsop.com/schedule/" target="_blank" class="btn btn-link">🌐 WSOP 스케줄 바로가기</a>
        </div>
    </div>
</body>
</html>
