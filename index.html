<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 첫 To-Do 앱</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; background-color: #f4f4f9; }
        .todo-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-top: 0; color: #333; }
        input { width: 65%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button.add-btn { padding: 8px 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { padding: 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        li.completed span { text-decoration: line-through; color: #888; }
        .del-btn { background-color: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
        .todo-text { cursor: pointer; }
    </style>
</head>
<body>
    <div class="todo-container">
        <h2>📝 오늘의 할 일</h2>
        <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
        <button class="add-btn" onclick="addTodo()">추가</button>
        <ul id="todoList"></ul>
    </div>

    <script>
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text !== '') {
                const li = document.createElement('li');
                
                const span = document.createElement('span');
                span.textContent = text;
                span.className = 'todo-text';
                span.onclick = function() {
                    li.classList.toggle('completed');
                };

                const delBtn = document.createElement('button');
                delBtn.textContent = '삭제';
                delBtn.className = 'del-btn';
                delBtn.onclick = function() {
                    li.remove();
                };

                li.appendChild(span);
                li.appendChild(delBtn);
                document.getElementById('todoList').appendChild(li);
                input.value = '';
            }
        }
    </script>
</body>
</html>
